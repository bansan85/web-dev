<h1>PDF manipulation</h1>
<input #fileInput accept="application/pdf" type="file">
<button #compressBtn type="button" (click)="compress()">Compresser</button>
<button #splitBtn type="button" (click)="split()">Split</button>
<p #status></p>
<button #singleDlBtn style="display: none;" type="button" (click)="singleDownload()">Télécharger</button>
<button #multipleDlBtn style="display: none;" type="button" (click)="multipleDownload()">Télécharger</button>
