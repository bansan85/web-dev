<h1>PDF manipulation</h1>

<app-tabs>
  <app-tab-item tabName="Single PDF">
    <input
      accept="application/pdf"
      type="file"
      (change)="onSingleFileSelected($event)"
    /><br />
    <h2>Actions</h2>
    <h3>Various</h3>
    <button type="button" (click)="compress()">Compress</button><br />
    <button type="button" (click)="pageCount()">Show</button>
    <h3>Split</h3>
    <button type="button" (click)="split()">Each page</button>
    <p>{{ this.status() }}</p>
    <h3>Result</h3>
    <button type="button" [class]="downloadVisilibity()" (click)="download()">
      Télécharger
    </button>

    @for (url of generatedPageUrls(); track $index) {
      @if (url) {
        <img [alt]="`Page ${$index + 1}`" [src]="url" />
      } @else {
        <div class="loader">Loading page {{ $index + 1 }}...</div>
      }
    }
  </app-tab-item>
  <app-tab-item tabName="Project">vcn,x</app-tab-item>
  <app-tab-item tabName="Target">ghfdjkl</app-tab-item>
</app-tabs>

<a href="https://github.com/bansan85/web-demangler">
  <app-github-mark-inline class="github_logo" />
</a>
